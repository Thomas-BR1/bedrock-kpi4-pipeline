# Render Blueprint — defines the weekly KPI 4 cron job.
# See https://render.com/docs/infrastructure-as-code
services:
  - type: cron
    name: bedrock-kpi4-weekly
    runtime: python
    plan: starter
    # Thursdays at 12:00 UTC = 7:00 AM Central Daylight Time (6 AM standard).
    schedule: "0 12 * * 4"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_kpi4.py
    envVars:
      - key: GOOGLE_SERVICE_ACCOUNT
        sync: false        # set in dashboard, do not commit
      - key: DRIVE_CSV_FOLDER_ID
        sync: false
      - key: COMBINED_FILE_ID
        sync: false
      - key: EXCLUDE_PLANS
        value: "Bedrock - Plus Salt Delivery Add-On,Bedrock - Basic Salt Delivery Add-On,Bedrock Basic (1 year Non-Renewing),Free Plus Membership"
      - key: PYTHONUNBUFFERED
        value: "1"
