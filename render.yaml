# Render Blueprint — defines the daily KPI 4 cron job.
services:
  - type: cron
    name: bedrock-kpi4-daily
    runtime: python
    plan: starter
    # Daily at 01:30 UTC = 8:30 PM Central Daylight Time / 7:30 PM Central Standard Time.
    # Runs 30 min after GitHub Actions scrape so the CSV is already in Drive.
    schedule: "30 1 * * *"
    buildCommand: pip install -r requirements-render.txt
    startCommand: python scripts/run_kpi4.py
    envVars:
      - key: GOOGLE_SERVICE_ACCOUNT
        sync: false
      - key: DRIVE_CSV_FOLDER_ID
        sync: false
      - key: COMBINED_FILE_ID
        sync: false
      - key: EXCLUDE_PLANS
        value: "Bedrock - Plus Salt Delivery Add-On,Bedrock - Basic Salt Delivery Add-On,Bedrock Basic (1 year Non-Renewing),Free Plus Membership"
      - key: PYTHONUNBUFFERED
        value: "1"
